name: Build

permissions:
  contents: read

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

env:
  LLVM_VERSION: '22'
  MSVC_WINE_COMMIT: '514f8ea34842cd6d831804d0e9658d3a32870ae1'

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  format:
    name: Format Check
    runs-on: ubuntu-latest
    timeout-minutes: 3
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-llvm
        with:
          llvm-version: ${{ env.LLVM_VERSION }}
          extra-tools: clang-format

      - name: clang-format check
        run: |
          find core games tests -type f \( -name '*.cpp' -o -name '*.hpp' \) -print0 \
            | xargs -0 clang-format --dry-run --Werror

  tidy:
    name: Clang-Tidy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-llvm
        with:
          llvm-version: ${{ env.LLVM_VERSION }}
          extra-tools: clang-tidy

      - name: Clone msvc-wine
        run: git clone https://github.com/mstorsjo/msvc-wine.git /tmp/msvc-wine && git -C /tmp/msvc-wine checkout $MSVC_WINE_COMMIT

      - name: Get MSVC version
        id: msvc-version
        run: |
          MSVC_VER=$(/tmp/msvc-wine/vsdownload.py --print-version | grep -oE '[0-9]+\.[0-9]+\.[0-9]+(\.[0-9]+)?' | tail -1)
          echo "version=$MSVC_VER" >> "$GITHUB_OUTPUT"

      - name: Restore msvc-wine cache
        id: msvc-wine-cache
        uses: actions/cache@v6
        with:
          path: ~/.msvc
          key: msvc-wine-${{ steps.msvc-version.outputs.version }}-${{ hashFiles('cmake/toolchains/*.cmake') }}
          restore-keys: msvc-wine-

      - name: Install msvc-wine
        if: steps.msvc-wine-cache.outputs.cache-hit != 'true'
        run: |
          /tmp/msvc-wine/vsdownload.py --accept-license --dest ~/.msvc
          /tmp/msvc-wine/install.sh ~/.msvc

      - name: Configure CMake
        run: |
          cmake --preset wine-x64
          cmake --preset wine-x86

      - name: Build PCH
        run: |
          # Every target's PCH, so adding a game needs no change here.
          for arch in x64 x86; do
            dir="build/$arch"
            PCH=$(ninja -C "$dir" -f build-Release.ninja -t targets all \
                  | grep -oP '^\S+/Release/cmake_pch\.cxx\.pch(?=:)')
            test -n "$PCH"
            cmake --build --preset "wine-$arch-release" --target $PCH
          done

      - name: Filter compile DBs to Release
        run: |
          for dir in build/x64 build/x86; do
            python3 -c "import json,sys;j=[e for e in json.load(sys.stdin) if '/Release/' in e.get('command','')];assert j,'empty compile db after Release filter';json.dump(j,sys.stdout)" < "$dir/compile_commands.json" > "$dir/cc_release.json"
            mv "$dir/cc_release.json" "$dir/compile_commands.json"
          done

      - name: clang-tidy check
        run: |
          # Each architecture lints the sources its own build compiles: a game
          # skipped by one arch has no compile flags there, and core's per-arch
          # branches need checking on both.
          for dir in build/x64 build/x86; do
            jq -r '.[].file' "$dir/compile_commands.json" \
              | grep -E "^$PWD/(core/src|games)/.*\\.cpp$" | grep -v '/tests/' | sort -u \
              | xargs -P "$(nproc)" -n 1 clang-tidy -p "$dir" --warnings-as-errors='*'
          done

  build-windows:
    name: Build (Windows)
    runs-on: windows-2025-vs2026
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Configure x64 Release
        run: cmake --preset windows-x64-release

      - name: Build x64 Release
        run: cmake --build --preset windows-x64-release --config Release

      - name: Build x64 tests
        run: cmake --build --preset windows-x64-release --config Release --target PatchFix.Tests

      - name: Run x64 tests
        run: ctest --test-dir build/x64 -C Release --output-on-failure --no-tests=error

      - name: Configure x64 Debug
        run: cmake --preset windows-x64-debug

      - name: Build x64 Debug
        run: cmake --build --preset windows-x64-debug --config Debug

      - name: Configure x86 Release
        run: cmake --preset windows-x86-release

      - name: Build x86 Release
        run: cmake --build --preset windows-x86-release --config Release

      - name: Build x86 tests
        run: cmake --build --preset windows-x86-release --config Release --target PatchFix.Tests

      - name: Run x86 tests
        run: ctest --test-dir build/x86 -C Release --output-on-failure --no-tests=error

      - name: Configure x86 Debug
        run: cmake --preset windows-x86-debug

      - name: Build x86 Debug
        run: cmake --build --preset windows-x86-debug --config Debug

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: PatchFix-windows-${{ github.sha }}
          path: |
            build/x64/bin/Release/*.asi
            build/x64/bin/Debug/*.asi
            build/x86/bin/Release/*.asi
            build/x86/bin/Debug/*.asi
            games/**/*.ini
          if-no-files-found: error

  build-wine:
    name: Build (Wine cross-compile)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-llvm
        with:
          llvm-version: ${{ env.LLVM_VERSION }}

      - name: Clone msvc-wine
        run: git clone https://github.com/mstorsjo/msvc-wine.git /tmp/msvc-wine && git -C /tmp/msvc-wine checkout $MSVC_WINE_COMMIT

      - name: Get MSVC version
        id: msvc-version
        run: |
          MSVC_VER=$(/tmp/msvc-wine/vsdownload.py --print-version | grep -oE '[0-9]+\.[0-9]+\.[0-9]+(\.[0-9]+)?' | tail -1)
          echo "version=$MSVC_VER" >> "$GITHUB_OUTPUT"

      - name: Restore msvc-wine cache
        id: msvc-wine-cache
        uses: actions/cache@v6
        with:
          path: ~/.msvc
          key: msvc-wine-${{ steps.msvc-version.outputs.version }}-${{ hashFiles('cmake/toolchains/*.cmake') }}
          restore-keys: msvc-wine-

      - name: Install msvc-wine
        if: steps.msvc-wine-cache.outputs.cache-hit != 'true'
        run: |
          /tmp/msvc-wine/vsdownload.py --accept-license --dest ~/.msvc
          /tmp/msvc-wine/install.sh ~/.msvc

      - name: Install Wine
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update
          # Both arches, each pinned: asking for wine32:i386 alone lets apt
          # satisfy `wine` with i386 packages and drop the amd64 wine64.
          sudo apt-get install -y wine wine64:amd64 wine32:i386

      - name: Configure x64
        run: cmake --preset wine-x64

      - name: Build x64 Release
        run: cmake --build --preset wine-x64-release

      - name: Build x64 Debug
        run: cmake --build --preset wine-x64-debug

      - name: Build x64 tests
        run: cmake --build --preset wine-x64-release --target PatchFix.Tests

      - name: Run x64 tests
        run: ctest --test-dir build/x64 -C Release --output-on-failure --no-tests=error

      - name: Configure x86
        run: cmake --preset wine-x86

      - name: Build x86 Release
        run: cmake --build --preset wine-x86-release

      - name: Build x86 Debug
        run: cmake --build --preset wine-x86-debug

      - name: Build x86 tests
        run: cmake --build --preset wine-x86-release --target PatchFix.Tests

      - name: Run x86 tests
        run: ctest --test-dir build/x86 -C Release --output-on-failure --no-tests=error

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: PatchFix-wine-${{ github.sha }}
          path: |
            build/x64/bin/Release/*.asi
            build/x64/bin/Debug/*.asi
            build/x86/bin/Release/*.asi
            build/x86/bin/Debug/*.asi
            games/**/*.ini
          if-no-files-found: error
