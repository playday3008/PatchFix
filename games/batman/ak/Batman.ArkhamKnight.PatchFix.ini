[DLCLoader]
; Steam build only: the Epic and GOG builds load every folder under DLC
; themselves, so put custom folders directly in DLC there instead.
; Folder whose subfolders are loaded as DLC bundles, after the game's own DLC.
; Relative paths start at Binaries\Win64. Folders load in name order, and a
; later folder replaces files of the same name, so zero-padded prefixes like
; 10_ and 20_ set priority. Read at every DLC refresh, which happens at
; startup. Also logs the official DLC folders Steam did not install.
CustomRoot=..\..\DLC\Custom

[Hooks]
; Toggle individual hooks. Accepts: true/false, yes/no, on/off, 1/0
; ProcessEvent: the shared UnrealScript call hook every other feature builds on.
; Setting it to false takes effect on next launch, not on hot-reload.
ProcessEvent=true
; DLCLoader: Steam build only, see above. Loads every folder under CustomRoot
; as DLC. Needs ProcessEvent. Turning it on at runtime needs a relaunch;
; turning it off takes effect at the next refresh.
DLCLoader=true
