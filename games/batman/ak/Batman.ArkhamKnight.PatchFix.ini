[DLCLoader]
; Folder whose subfolders are loaded as DLC bundles, after the game's own DLC.
; Relative paths start at Binaries\Win64. Folders load in name order, and a
; later folder replaces files of the same name, so prefixes like 10_ and 20_
; set priority. Takes effect on next launch.
CustomRoot=..\..\DLC\Custom

[Hooks]
; Toggle individual hooks. Accepts: true/false, yes/no, on/off, 1/0
; ProcessEvent: the shared UnrealScript call hook every other feature builds on.
; Setting it to false takes effect on next launch, not on hot-reload.
ProcessEvent=true
; DLCLoader: loads every folder under CustomRoot as DLC. Needs ProcessEvent.
DLCLoader=true
