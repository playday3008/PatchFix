[UI]
; MovieRelayout: Re-run each HUD movie's screen layout every frame, as the
; game did before Patch 829. Without it a HUD element created before the
; screen layout settles keeps its first placement, which can leave it
; partly off-screen. Hot-reloadable.
RelayoutEveryFrame=true

[Camera]
; CameraShake: Remove camera shake in gameplay, both the wobble and the
; brief FOV pulse on impacts. Cutscenes keep the shake animated into them.
; Hot-reloadable.
DisableShake=false
; CinematicAspect: Keep in-engine cutscenes Hor+ in exclusive fullscreen on
; displays wider than 16:9, as they already are in a window. Without it they
; are cropped at the top and bottom. Hot-reloadable.
ClampCinematicAspect=true
; FovScale: Multiply the gameplay camera's field of view (exploring,
; climbing, aiming and scripted gameplay cameras). Cutscenes keep their
; framing. 1.0 = stock, 1.2 = 20% wider. Hot-reloadable.
FovMultiplier=1.0

[FPS]
; FrameLimiter: Cap the frame rate. Below 1 = off (stock, uncapped). 60 avoids
; the Endurance boss fight freeze, where the second QTE prompt never appears at
; high frame rates. Caps from 1 to 15 are raised to 15, since the game runs in
; slow motion below that. Hot-reloadable.
FrameCap=0

[Hooks]
; Toggle individual hooks. Some hooks support hot-reload; others only
; take effect on next launch. Accepts: true/false, yes/no, on/off, 1/0
; VoiceLanguage: Save the voice language chosen in the options menu, so it
; survives a restart and applying Display Options, and show the one in use in
; the menu. Non-Steam builds only (checked on Epic); on Steam the voice
; language follows the Steam client language and this hook reports its
; patterns as not found.
; SaveCompatibility: Use save files copied between the Steam and non-Steam
; (checked on Epic) versions. Non-Steam builds load Steam saves, which they
; rejected as corrupt; the Steam build shows non-Steam saves with their date
; and progress in the load menu. Each build reports the other build's pattern
; as not found.
MovieRelayout=true
CameraShake=true
CinematicAspect=true
VoiceLanguage=true
FovScale=true
FrameLimiter=true
SaveCompatibility=true
